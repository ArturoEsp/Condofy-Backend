name: CI/CD Pipeline - NestJS & Prisma

on:
  push:
    branches:
      - main # O el nombre de tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio en la máquina de GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js y compilar (Validación del CI)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Build NestJS
        run: |
          npx prisma generate
          npm run build

      # 3. Despliegue en el Droplet vía SSH (CD)
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /ruta/de/tu/proyecto # Cambia esto a la carpeta en tu servidor
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f # Limpia imágenes viejas para no llenar el disco de 25GB