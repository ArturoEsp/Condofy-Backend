name: CI/CD Pipeline - Condofy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar el despliegue manualmente desde la interfaz de GitHub

jobs:
  build-and-test:
    name: Build & Validate (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client & Build NestJS
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/condofy?schema=public"
        run: |
          npx prisma generate
          yarn build

  deploy:
    name: Deploy to DigitalOcean (CD)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/condofy-backend
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
